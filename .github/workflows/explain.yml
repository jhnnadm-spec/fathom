# A button on GitHub (Actions tab → "Write explanations" → "Run workflow")
# that has the AI write plain-English explanations for the companies you type,
# checks every claim against the reports, and saves the results into the project.
# Vercel then publishes them automatically.
name: Write explanations

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers, separated by spaces"
        required: true
        default: "AAPL"
      model:
        description: "Cloudflare model (leave blank for the default)"
        required: false
        default: ""

permissions:
  contents: write # lets the job save the explanations into the project

concurrency:
  group: explanations
  cancel-in-progress: false

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write and check explanations
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: ${{ inputs.model }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          mkdir -p run-log
          npx tsx scripts/explain.ts $TICKERS 2>&1 | tee run-log/explain.txt
          exit ${PIPESTATUS[0]}
      - name: Save the explanations into the project
        if: always()
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/explanations
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -q -m "Add explanations for: $TICKERS"
          git pull --rebase -q origin main
          git push origin HEAD:main
      - name: Publish the run log to the explain-log branch
        if: always()
        run: |
          [ -f run-log/explain.txt ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan explain-log
          git rm -rq --cached . > /dev/null
          git add -f run-log vercel.json
          git commit -q -m "Explain run log"
          git push -fq origin explain-log
