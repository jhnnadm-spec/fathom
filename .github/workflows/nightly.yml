# Runs every day at 23:10 UTC (07:10 in Malaysia), shortly before the free
# Cloudflare AI allowance resets at midnight UTC, so it uses what's left of
# the day. It also keeps the free Supabase project awake.
name: Daily explanations

on:
  schedule:
    - cron: "10 23 * * *"
  workflow_dispatch: {}

concurrency:
  group: explanations
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write queued explanations
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/nightly.ts
