# A button on GitHub (Actions tab → "Try SEC data" → "Run workflow") that
# downloads real SEC data for the companies you type and saves the results
# so they can be checked. Nothing is published to the website.
name: Try SEC data

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers or company names, separated by spaces"
        required: true
        default: "AAPL"

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download and process SEC data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TICKERS: ${{ inputs.tickers }}
        run: npx tsx scripts/try-report.ts $TICKERS
      - name: Save the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-output
          path: out/
          if-no-files-found: warn
          retention-days: 7
