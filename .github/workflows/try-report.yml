# A button on GitHub (Actions tab → "Try SEC data" → "Run workflow") that
# downloads real SEC data for the companies you type and saves the results
# so they can be checked. Nothing is published to the website.
name: Try SEC data

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers or company names, separated by spaces"
        required: true
        default: "AAPL"

permissions:
  contents: write # lets the job publish its results to the sec-data branch

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download and process SEC data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TICKERS: ${{ inputs.tickers }}
        run: npx tsx scripts/try-report.ts $TICKERS
      - name: Publish the results to the sec-data branch
        if: always()
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ ! -d out ]; then echo "No results to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sec-data
          git rm -rf --cached . > /dev/null
          # vercel.json comes along so Vercel knows not to publish this branch.
          git add -f out vercel.json
          git commit -q -m "SEC data for: $TICKERS"
          git push -f origin sec-data
